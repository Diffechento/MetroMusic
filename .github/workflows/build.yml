# Builds the app on GitHub's own runners, and attaches the artefacts to a release when a `v*` tag
# is pushed.
#
# Everything the build needs is in the repository: the Gradle wrapper is committed, and MangoTile
# resolves from Maven Central, so a clean checkout builds with nothing installed by hand.
# `mavenLocal()` comes first in `settings.gradle.kts` and is simply empty here, which is what lets
# the same file serve a machine with a local framework checkout and a runner without one.
#
# The secrets are all optional, and what they change is stated where they are read. Without any of
# them this still produces a working APK — it is just signed with the debug key, which the release
# job then refuses to publish.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
      version: ${{ steps.version.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      # AGP 8.10 needs JDK 17 to *run*. The module's own `jvmTarget = "11"` is about the bytecode it
      # emits and is unrelated — mixing the two up is the usual way this file gets written wrong.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # compileSdk 36 is newer than what the runner image ships, and the build fails at configuration
      # time without it rather than downloading it itself.
      - name: Install the compile SDK platform
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36"

      # Optional: LASTFM_API_KEY / LASTFM_API_SECRET. They identify the application, not a listener.
      # Absent, scrobbling and the online cover lookup behave as if switched off and the app asks for
      # a key on its Last.fm page instead — so a fork's build is not broken by not having them.
      - name: Last.fm credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          if [ -n "$LASTFM_API_KEY" ]; then
            printf 'LASTFM_API_KEY=%s\nLASTFM_API_SECRET=%s\n' "$LASTFM_API_KEY" "$LASTFM_API_SECRET" \
              > local.properties
            echo "Last.fm credentials supplied."
          else
            echo "No Last.fm credentials; building without them."
          fi

      # Optional: the release keystore, as four secrets. KEYSTORE_BASE64 is the .jks itself —
      #   base64 -w0 metromusic.jks        (certutil -encode on Windows, minus the header lines)
      # Secrets are not exposed to workflows triggered by a fork's pull request, so this step simply
      # finds nothing there and the build falls back to the debug key.
      - name: Release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > metromusic.jks
            {
              echo "storeFile=metromusic.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the release key."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret; the release variant will be signed with the debug key."
          fi

      # The minified variant is the one worth building: R8 is on for release, and the serialization
      # rules in proguard-rules.pro are the part that a debug build cannot check.
      - name: Assemble
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Version name
        id: version
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "versionName $name"

      # Releasing means keeping four things in step: the tag, `versionName`, the `RELEASE_DATE` literal
      # the about page shows, and the fastlane changelog for this `versionCode` — which *is* the
      # "what's new" on the F-Droid page and is read from the commit being built, so a missing one is
      # silently no changelog rather than an error anywhere. This step checks them on a tag build
      # instead of writing them.
      #
      # Deliberately a check and not a write. The date is a literal so that the same source always
      # builds the same APK: `Date()` at configure time would make no two builds agree and no task
      # could ever be up to date. Having CI stamp it would be worse than the manual step it saves —
      # F-Droid builds this very commit on their own infrastructure, with none of this workflow, so
      # their binary and the release here would disagree about what version they are. What is actually
      # easy to forget is moving the literal, and forgetting is exactly what a failing build fixes.
      - name: The tag, the version and the date agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="${{ steps.version.outputs.name }}"
          code=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          literal=$(sed -n 's/.*RELEASE_DATE", "\\"\(.*\)\\"".*/\1/p' app/build.gradle.kts)
          fail=0

          if [ "$GITHUB_REF_NAME" != "v$name" ]; then
            echo "::error::tag $GITHUB_REF_NAME against versionName $name — the tag is v<versionName>."
            fail=1
          fi

          # `date -d` reads "1 august 2026"; an unparseable literal is itself the failure.
          if ! stamped=$(date -d "$literal" +%Y-%m-%d 2>/dev/null); then
            echo "::error::RELEASE_DATE \"$literal\" is not a date this can read."
            fail=1
          else
            tagged=$(git log -1 --format=%cs)
            # A day either side, because the runner reads the commit date in UTC and the commit was
            # made in somebody's own timezone. Weeks of slack is what this is meant to catch: a literal
            # left at the previous release's date.
            if [ "$(( ( $(date -d "$stamped" +%s) - $(date -d "$tagged" +%s) ) / 86400 ))" -gt 1 ] ||
               [ "$(( ( $(date -d "$tagged" +%s) - $(date -d "$stamped" +%s) ) / 86400 ))" -gt 1 ]; then
              echo "::error::RELEASE_DATE is $stamped but this commit is from $tagged — move the literal in app/build.gradle.kts."
              fail=1
            fi
          fi

          changelog="fastlane/metadata/android/en-US/changelogs/$code.txt"
          if [ ! -f "$changelog" ]; then
            echo "::error::no $changelog — that file is the what's-new on the F-Droid page."
            fail=1
          elif [ "$(wc -c < "$changelog")" -gt 500 ]; then
            echo "::error::$changelog is $(wc -c < "$changelog") characters; F-Droid's limit is 500."
            fail=1
          fi

          [ "$fail" = 0 ] || exit 1
          echo "$GITHUB_REF_NAME · versionName $name · versionCode $code · released $literal · $changelog"

      - name: Name the artefacts after the version
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/MetroMusic-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
             "out/MetroMusic-${{ steps.version.outputs.name }}.aab"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: metromusic-${{ steps.version.outputs.name }}
          path: out/*
          if-no-files-found: error

  # Only for a pushed tag, and only for a build that was really signed — otherwise this job is
  # *skipped*, not failed: a debug-key APK is installable, which is why it is built at all, but
  # published as a release it would become the signature every later update has to match, and the
  # debug key is not one anybody can keep. Add the four secrets and re-run the tag to fill a release
  # in; a tag built without them still goes green with its artefacts on the run itself.
  release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: metromusic-${{ needs.build.outputs.version }}
          path: out

      # Notes are written by hand, in the repository, at `.github/release-notes/<tag>.md` — a
      # generated list of commit subjects is not what someone deciding whether to install this wants
      # to read. Without a file for the tag, GitHub's own generated notes are the fallback rather than
      # a failure. An existing release is left alone and only has the binaries hung on it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes=".github/release-notes/${tag}.md"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            if [ -f "$notes" ]; then
              gh release create "$tag" --verify-tag \
                --title "MetroMusic ${{ needs.build.outputs.version }}" --notes-file "$notes"
            else
              echo "::warning::No $notes; falling back to generated notes."
              gh release create "$tag" --verify-tag \
                --title "MetroMusic ${{ needs.build.outputs.version }}" --generate-notes
            fi
          fi
          gh release upload "$tag" out/* --clobber
